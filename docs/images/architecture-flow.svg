<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="380" viewBox="0 0 1800 380" role="img" aria-labelledby="title desc">
  <title id="title">Well Information Event-Driven Architecture</title>
  <desc id="desc">UI sends write requests to C# API, API publishes to Kafka, Node.js consumer writes to PostgreSQL. UI reads status through C# API from PostgreSQL.</desc>
  <defs>
    <style>
      .bg { fill: #14191f; }
      .box { fill: #20262d; stroke: #1f88c9; stroke-width: 2; rx: 8; ry: 8; }
      .db { fill: #20262d; stroke: #1f88c9; stroke-width: 2; }
      .label { fill: #d7dde4; font-family: Segoe UI, Arial, sans-serif; font-size: 31px; }
      .small { fill: #c7d0da; font-family: Segoe UI, Arial, sans-serif; font-size: 31px; }
      .arrow { stroke: #1f88c9; stroke-width: 3; fill: none; }
      .readArrow { stroke: #1f88c9; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f88c9" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="380" />

  <rect class="box" x="60" y="120" width="220" height="90" />
  <text class="label" x="170" y="175" text-anchor="middle">Project UI</text>

  <rect class="box" x="430" y="120" width="170" height="90" />
  <text class="label" x="515" y="175" text-anchor="middle">C# API</text>

  <rect class="box" x="760" y="95" width="250" height="90" />
  <text class="label" x="885" y="150" text-anchor="middle">Kafka projects.events.v1</text>

  <rect class="box" x="1140" y="85" width="220" height="110" />
  <text class="label" x="1250" y="150" text-anchor="middle">Node.js Consumer</text>

  <ellipse class="db" cx="1570" cy="105" rx="130" ry="25" />
  <rect class="db" x="1440" y="105" width="260" height="90" />
  <ellipse class="db" cx="1570" cy="195" rx="130" ry="25" />
  <text class="label" x="1570" y="155" text-anchor="middle">WellInformationDB.public.projects</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M280 162 L430 162" />
  <text class="small" x="355" y="150" text-anchor="middle">Create or update request</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M600 140 L760 140" />
  <text class="small" x="680" y="130" text-anchor="middle">Publish event</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M1010 140 L1140 140" />

  <path class="arrow" marker-end="url(#arrowHead)" d="M1360 140 L1440 155" />
  <text class="small" x="1400" y="145" text-anchor="middle">Store project data</text>

  <path class="readArrow" marker-end="url(#arrowHead)" d="M280 190 L430 190" />
  <text class="small" x="355" y="210" text-anchor="middle">Read project status</text>

  <path class="readArrow" marker-end="url(#arrowHead)" d="M600 190 C760 230, 1250 240, 1440 185" />
  <text class="small" x="980" y="225" text-anchor="middle">Read only</text>
</svg>
