<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">Well Information Event-Driven Architecture</title>
  <desc id="desc">UI sends write requests to Node.js API, API publishes to Kafka, Node.js consumer writes to PostgreSQL. UI reads status through Node.js API from PostgreSQL.</desc>
  <defs>
    <style>
      .bg { fill: #14191f; }
      .box { fill: #20262d; stroke: #1f88c9; stroke-width: 1.5; rx: 6; ry: 6; }
      .db { fill: #20262d; stroke: #1f88c9; stroke-width: 1.5; }
      .label { fill: #d7dde4; font-family: Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .edge { fill: #8eacbf; font-family: Segoe UI, Arial, sans-serif; font-size: 11px; }
      .arrow { stroke: #1f88c9; stroke-width: 2; fill: none; }
      .readArrow { stroke: #1f88c9; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1f88c9" />
    </marker>
  </defs>

  <rect class="bg" width="1100" height="260" />

  <!-- UI -->
  <rect class="box" x="30" y="80" width="100" height="50" />
  <text class="label" x="80" y="110" text-anchor="middle">UI</text>

  <!-- Node.js API -->
  <rect class="box" x="230" y="80" width="130" height="50" />
  <text class="label" x="295" y="110" text-anchor="middle">Node.js API</text>

  <!-- Kafka -->
  <rect class="box" x="460" y="80" width="100" height="50" />
  <text class="label" x="510" y="110" text-anchor="middle">Kafka</text>

  <!-- Node.js Consumer -->
  <rect class="box" x="660" y="80" width="150" height="50" />
  <text class="label" x="735" y="110" text-anchor="middle">Node.js Consumer</text>

  <!-- PostgreSQL -->
  <ellipse class="db" cx="940" cy="85" rx="80" ry="14" />
  <rect class="db" x="860" y="85" width="160" height="50" />
  <ellipse class="db" cx="940" cy="135" rx="80" ry="14" />
  <text class="label" x="940" y="115" text-anchor="middle">PostgreSQL</text>

  <!-- Write path arrows -->
  <path class="arrow" marker-end="url(#ah)" d="M130,100 L228,100" />
  <text class="edge" x="179" y="93" text-anchor="middle">Write request</text>

  <path class="arrow" marker-end="url(#ah)" d="M360,100 L458,100" />
  <text class="edge" x="409" y="93" text-anchor="middle">Publish event</text>

  <path class="arrow" marker-end="url(#ah)" d="M560,100 L658,100" />

  <path class="arrow" marker-end="url(#ah)" d="M810,105 L858,105" />
  <text class="edge" x="834" y="98" text-anchor="middle">Store</text>

  <!-- Read path arrows -->
  <path class="readArrow" marker-end="url(#ah)" d="M130,118 L228,118" />
  <text class="edge" x="179" y="140" text-anchor="middle">Read status</text>

  <path class="readArrow" marker-end="url(#ah)" d="M360,125 C500,175 750,175 858,130" />
  <text class="edge" x="610" y="175" text-anchor="middle">Read only</text>
</svg>
